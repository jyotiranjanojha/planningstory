  <text x="984" y="237" text-anchor="middle" fill="#6b21a8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">4b. Unified LLM Client (.env)</text>
  <text x="890" y="270" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Ollama (Default) / Multi-Cloud</text>
  <text x="890" y="288" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- qwen2.5-coder, gemma3</text>
  <text x="890" y="304" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- OpenAI, Azure, Anthropic</text>

  <!-- Bottom Security & Observability Strip -->
  <rect x="26" y="352" width="1068" height="54" rx="12" fill="#ffffff" stroke="#d5e2f0"/>
  <text x="46" y="384" fill="#004e8c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Enterprise Guardrails:</text>
  <text x="195" y="384" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11.5">Non-Root UID 10001  |  K8s Secrets (No .env in Git)  |  Harbor imagePullSecrets  |  RollingUpdate (maxUnavailable: 0)  |  /api/ready Probe</text>
</svg>
