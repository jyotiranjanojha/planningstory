<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faff"/>
      <stop offset="100%" stop-color="#edf3fa"/>
    </linearGradient>
    <linearGradient id="intelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0068B5"/>
      <stop offset="100%" stop-color="#00A3E0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0068B5"/>
    </marker>
  </defs>

  <rect width="1120" height="430" rx="18" fill="url(#bgGrad)" stroke="#d5e2f0" stroke-width="1.5"/>

  <!-- Header Strip -->
  <rect x="0" y="0" width="1120" height="54" rx="18" fill="url(#intelGrad)"/>
