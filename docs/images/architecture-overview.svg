  <rect x="508" y="76" width="320" height="252" rx="14" fill="#ffffff" stroke="#0068B5" stroke-width="1.8"/>
  <rect x="508" y="76" width="320" height="34" rx="14" fill="#0068B5"/>
  <text x="668" y="98" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">3. FastAPI + V2 Multi-Agent Core (:8001)</text>
  <text x="524" y="130" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">PlanningCopilotV2 (&lt;1ms Routing + Memory)</text>

