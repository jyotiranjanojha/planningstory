  <text x="28" y="34" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Intel Foundry Planning Story v2.1 - Enterprise Single-Origin Architecture</text>
  <rect x="916" y="14" width="180" height="26" rx="13" fill="#ffffff" fill-opacity="0.2"/>
  <text x="1006" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">HARBOR + RANCHER READY</text>

