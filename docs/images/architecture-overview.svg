  <text x="890" y="160" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- 22 Input tables (by_input/)</text>
  <text x="890" y="176" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- 18 Output tables (by_output/)</text>
  <text x="890" y="192" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">40-200ms SQL Execution</text>

