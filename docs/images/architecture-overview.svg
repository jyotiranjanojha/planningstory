  <rect x="26" y="88" width="180" height="224" rx="14" fill="#ffffff" stroke="#c8daec" stroke-width="1.5"/>
  <rect x="26" y="88" width="180" height="34" rx="14" fill="#e8f3fc"/>
  <text x="116" y="110" text-anchor="middle" fill="#004e8c" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">1. Client &amp; Ingress</text>
  <text x="42" y="146" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Planner Web UI</text>
  <text x="42" y="164" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">Chat, Validation, Compare</text>
  <text x="42" y="180" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">Root Cause, Graph, KPIs</text>
  <line x1="42" y1="198" x2="190" y2="198" stroke="#e2ecf5"/>
  <text x="42" y="218" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Rancher NGINX Ingress</text>
  <text x="42" y="236" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- TLS + Sticky Cookies</text>
  <text x="42" y="252" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- proxy-buffering: off</text>
  <text x="42" y="268" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- 300s SSE Timeout</text>
  <rect x="42" y="282" width="148" height="20" rx="10" fill="#dcfce7"/>
  <text x="116" y="296" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Single Origin (:3000)</text>

  <!-- Arrow 1->2 -->
  <line x1="208" y1="200" x2="246" y2="200" stroke="#0068B5" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Box 2: Node Gateway -->
  <rect x="252" y="88" width="210" height="224" rx="14" fill="#ffffff" stroke="#c8daec" stroke-width="1.5"/>
  <rect x="252" y="88" width="210" height="34" rx="14" fill="#e6f7ef"/>
  <text x="357" y="110" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700">2. Node.js Gateway (:3000)</text>
  <text x="268" y="146" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Microsoft Entra ID SSO</text>
  <text x="268" y="164" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- OAuth2 + httpOnly Cookies</text>
  <text x="268" y="180" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- CSRF oauth_state Guard</text>
