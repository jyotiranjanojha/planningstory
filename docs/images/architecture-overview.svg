  <text x="668" y="162" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Capacity</text>

  <rect x="720" y="142" width="92" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="766" y="162" text-anchor="middle" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Inventory</text>

  <rect x="524" y="182" width="92" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="570" y="202" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Validation (5)</text>

  <rect x="622" y="182" width="92" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="668" y="202" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Root Cause</text>

  <rect x="720" y="182" width="92" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="766" y="202" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Graph Lineage</text>

  <rect x="524" y="222" width="92" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="570" y="242" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">BOM Lineage</text>

  <rect x="622" y="222" width="92" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="668" y="242" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Supply Orders</text>

  <rect x="720" y="222" width="92" height="32" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="766" y="242" text-anchor="middle" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">Scenarios</text>

  <line x1="524" y1="268" x2="812" y2="268" stroke="#e2ecf5"/>
  <text x="524" y="288" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- ConversationManager (JSONL + Atomic Index)</text>
  <text x="524" y="306" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- Grounded Evidence - Zero Hallucination Policy</text>

  <!-- Arrow 3->4 -->
  <line x1="830" y1="150" x2="868" y2="150" stroke="#0068B5" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="830" y1="260" x2="868" y2="260" stroke="#0068B5" stroke-width="2.2" marker-end="url(#arrow)"/>

