  <text x="268" y="216" fill="#0f253c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Transparent Proxy Layer</text>
  <text x="268" y="234" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- Pooled Keep-Alive Sockets</text>
  <text x="268" y="250" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- Unbuffered SSE Streaming</text>
  <text x="268" y="266" fill="#4a647d" font-family="Arial, Helvetica, sans-serif" font-size="11">- /api/ready K8s Probe</text>
  <rect x="268" y="282" width="178" height="20" rx="10" fill="#e0f2fe"/>
  <text x="357" y="296" text-anchor="middle" fill="#0369a1" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700">127.0.0.1 IPv4 - ~5ms Hop</text>

