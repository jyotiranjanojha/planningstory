services:
  planningstory:
    image: amr-registry-pre.caas.intel.com/if-pdh-ai-assist/planningstory:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://proxy-dmz.intel.com:912
        HTTPS_PROXY: http://proxy-dmz.intel.com:912
        NO_PROXY: localhost,127.0.0.0/8,10.0.0.0/8,.intel.com
    container_name: planningstory
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      http_proxy: http://proxy-dmz.intel.com:912
      https_proxy: http://proxy-dmz.intel.com:912
      no_proxy: localhost,127.0.0.0/8,10.0.0.0/8,.intel.com
      HTTP_PROXY: http://proxy-dmz.intel.com:912
      HTTPS_PROXY: http://proxy-dmz.intel.com:912
      NO_PROXY: localhost,127.0.0.0/8,10.0.0.0/8,.intel.com
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: 8001
      PYTHON_BASE_URL: http://127.0.0.1:8001
      V2_CORE_ENABLED: "true"
      LLM_PROVIDER: ollama
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
