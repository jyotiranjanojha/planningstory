apiVersion: v1
kind: ConfigMap
metadata:
  name: planningstory-config
  namespace: if-pdh-ai-assist
  labels:
    app: planningstory
data:
  # Fixed container & Intel corporate proxy plumbing (no need to edit per environment).
  # All application settings (LLM provider/keys, Entra ID SSO, shared data paths,
  # auto-refresh interval) are managed in your .env.caas file and loaded into
  # Kubernetes Secret `planningstory-secrets` via:
  #   kubectl -n if-pdh-ai-assist create secret generic planningstory-secrets \
  #     --from-env-file=.env.caas --dry-run=client -o yaml | kubectl apply -f -
  http_proxy: "http://proxy-dmz.intel.com:912"
  https_proxy: "http://proxy-dmz.intel.com:912"
  no_proxy: "localhost,127.0.0.0/8,10.0.0.0/8,.intel.com,.svc,.svc.cluster.local"
  HTTP_PROXY: "http://proxy-dmz.intel.com:912"
  HTTPS_PROXY: "http://proxy-dmz.intel.com:912"
  NO_PROXY: "localhost,127.0.0.0/8,10.0.0.0/8,.intel.com,.svc,.svc.cluster.local"
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  BACKEND_HOST: "127.0.0.1"
  BACKEND_PORT: "8001"
  PYTHON_BASE_URL: "http://127.0.0.1:8001"
  PROXY_TIMEOUT_MS: "120000"
  V2_CORE_ENABLED: "true"
  SEMANTIC_MODE: "legacy"
