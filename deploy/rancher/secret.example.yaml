# Template ONLY — do NOT commit real credentials to Git.
# Create in Rancher UI (Storage -> Secrets -> Opaque) or directly from your local .env:
#   kubectl -n if-pdh-ai-assist create secret generic planningstory-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: planningstory-secrets
  namespace: if-pdh-ai-assist
  labels:
    app: planningstory
type: Opaque
stringData:
  AZURE_TENANT_ID: "REPLACE_WITH_TENANT_ID"
  AZURE_CLIENT_ID: "REPLACE_WITH_CLIENT_ID"
  AZURE_CLIENT_SECRET: "REPLACE_WITH_CLIENT_SECRET"
  AZURE_GROUP_IDS: "REPLACE_WITH_GROUP_ID"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
